<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>圣诞节微信红包挂件（1053×354，透明底）</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1053px; height: 354px; overflow: hidden; background: transparent; }
  body.preview { background: #A3121D; }
  svg { display: block; }
  path[fill="url(#ribbon)"] { stroke: #F6C963; stroke-width: 3; stroke-linejoin: round; }
</style>
</head>
<body>
<!-- 挂件覆盖在封面顶部：松枝花环横跨，正中为红色蝴蝶结与金铃铛，两侧垂挂圣诞球。加 ?preview 可在红底上预览 -->
<svg width="1053" height="354" viewBox="0 0 1053 354" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ballRed" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FF8A8A"/><stop offset="0.4" stop-color="#E5283A"/><stop offset="1" stop-color="#8A0A16"/>
    </radialGradient>
    <radialGradient id="ballGold" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FFF6D8"/><stop offset="0.45" stop-color="#F3C25A"/><stop offset="1" stop-color="#A8701E"/>
    </radialGradient>
    <radialGradient id="ballWhite" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#F1E6E6"/><stop offset="1" stop-color="#C9B3B5"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0384A"/><stop offset="1" stop-color="#A50E1E"/>
    </linearGradient>
    <radialGradient id="bulb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFBE6"/><stop offset="0.35" stop-color="#FFE08A" stop-opacity="0.9"/><stop offset="1" stop-color="#FFC24D" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#3A0006" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <g id="drops"></g>
    <g id="garland"></g>
    <g id="lights"></g>
    <g id="bow"></g>
  </g>
</svg>
<script>
(function () {
  if (location.search.includes('preview')) document.body.classList.add('preview');
  const NS = 'http://www.w3.org/2000/svg';
  let seed = 1225;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
  const $ = id => document.getElementById(id);
  const CX = 526.5;

  // 两段下垂的松枝花环（左右对称，汇于中央蝴蝶结）
  const swags = ['M14,40 C150,150 380,160 526,92', 'M1039,40 C903,150 673,160 526,92'];
  const greens = ['#0E4F2E', '#17663C', '#1F7A4A', '#2B9259', '#3BA86B'];
  const g = $('garland');
  const lowest = [];
  swags.forEach(d => {
    const p = el('path', { d, fill: 'none' }, g);
    const L = p.getTotalLength();
    el('path', { d, fill: 'none', stroke: '#0B3F24', 'stroke-width': 30, 'stroke-linecap': 'round' }, g);
    // 松针：沿路径放射的短线，深到浅分层
    greens.forEach((c, layer) => {
      for (let s = 0; s < L; s += 3.2) {
        const pt = p.getPointAtLength(s);
        const a = rnd() * Math.PI * 2, len = 14 + rnd() * 16 - layer * 1.5;
        el('line', { x1: pt.x.toFixed(1), y1: pt.y.toFixed(1), x2: (pt.x + Math.cos(a) * len).toFixed(1), y2: (pt.y + Math.sin(a) * len * 0.8).toFixed(1), stroke: c, 'stroke-width': 2.6, 'stroke-linecap': 'round' }, g);
      }
    });
    // 积雪
    for (let s = 10; s < L - 10; s += 26) {
      const pt = p.getPointAtLength(s);
      el('ellipse', { cx: pt.x + (rnd() - 0.5) * 8, cy: pt.y - 12 - rnd() * 4, rx: 9 + rnd() * 9, ry: 5 + rnd() * 3, fill: '#fff', opacity: 0.95 }, g);
    }
    // 暖光小灯
    for (let s = 20; s < L - 30; s += 44) {
      const pt = p.getPointAtLength(s);
      el('circle', { cx: pt.x, cy: pt.y + 6, r: 15, fill: 'url(#bulb)' }, $('lights'));
      el('circle', { cx: pt.x, cy: pt.y + 6, r: 3.6, fill: '#FFFBEA' }, $('lights'));
    }
    lowest.push(p);
  });

  // 垂挂的圣诞球
  const drops = $('drops');
  const ball = (x, y, len, r, f) => {
    el('line', { x1: x, y1: y, x2: x, y2: y + len - r, stroke: '#F6C963', 'stroke-width': 2.2 }, drops);
    el('rect', { x: x - r * 0.3, y: y + len - r - 9, width: r * 0.6, height: 11, rx: 2, fill: '#E9B54E' }, drops);
    el('circle', { cx: x, cy: y + len, r, fill: `url(#${f})` }, drops);
    el('ellipse', { cx: x - r * 0.35, cy: y + len - r * 0.38, rx: r * 0.22, ry: r * 0.14, fill: '#fff', opacity: 0.75, transform: `rotate(-30 ${x - r * 0.35} ${y + len - r * 0.38})` }, drops);
    if (f === 'ballWhite') el('path', { d: `M${x - r},${y + len} Q${x},${y + len + r * 0.35} ${x + r},${y + len}`, stroke: '#D9344A', 'stroke-width': 4, fill: 'none' }, drops);
  };
  [[0.30, 50, 20, 'ballGold'], [0.52, 82, 25, 'ballRed'], [0.74, 46, 18, 'ballWhite']].forEach(([t, len, r, f]) => {
    lowest.forEach(p => { const pt = p.getPointAtLength(p.getTotalLength() * t); ball(pt.x, pt.y, len, r, f); });
  });

  // 中央蝴蝶结 + 金铃
  const b = $('bow');
  const bell = (x, y, rot) => {
    const grp = el('g', { transform: `rotate(${rot} ${x} ${y})` }, b);
    el('path', { d: `M${x},${y} c-6,0 -24,8 -26,46 l-8,10 h68 l-8,-10 c-2,-38 -20,-46 -26,-46 z`, fill: 'url(#ballGold)', stroke: '#9C6A1C', 'stroke-width': 1.5 }, grp);
    el('rect', { x: x - 34, y: y + 52, width: 68, height: 6, rx: 3, fill: '#C98A2B' }, grp);
    el('circle', { cx: x, cy: y + 62, r: 7, fill: '#B07A22' }, grp);
    el('path', { d: `M${x - 12},${y + 14} q-4,10 -4,26`, stroke: '#FFF6D8', 'stroke-width': 4, fill: 'none', opacity: 0.7, 'stroke-linecap': 'round' }, grp);
  };
  bell(CX - 26, 132, 14);
  bell(CX + 26, 132, -14);
  // 飘带
  el('path', { d: `M${CX - 8},104 C${CX - 26},150 ${CX - 56},175 ${CX - 76},212 l24,-6 l6,22 C${CX - 34},180 ${CX - 14},170 ${CX + 2},110 z`, fill: 'url(#ribbon)' }, b);
  el('path', { d: `M${CX + 8},104 C${CX + 26},150 ${CX + 56},175 ${CX + 76},212 l-24,-6 l-6,22 C${CX + 34},180 ${CX + 14},170 ${CX - 2},110 z`, fill: 'url(#ribbon)' }, b);
  // 蝴蝶结两翼
  el('path', { d: `M${CX},96 C${CX - 40},44 ${CX - 120},44 ${CX - 108},96 C${CX - 100},140 ${CX - 40},124 ${CX},96 z`, fill: 'url(#ribbon)' }, b);
  el('path', { d: `M${CX},96 C${CX + 40},44 ${CX + 120},44 ${CX + 108},96 C${CX + 100},140 ${CX + 40},124 ${CX},96 z`, fill: 'url(#ribbon)' }, b);
  el('path', { d: `M${CX - 20},90 C${CX - 50},66 ${CX - 84},66 ${CX - 92},88`, stroke: '#FF9AA4', 'stroke-width': 4, fill: 'none', opacity: 0.6, 'stroke-linecap': 'round' }, b);
  el('path', { d: `M${CX + 20},90 C${CX + 50},66 ${CX + 84},66 ${CX + 92},88`, stroke: '#FF9AA4', 'stroke-width': 4, fill: 'none', opacity: 0.6, 'stroke-linecap': 'round' }, b);
  el('rect', { x: CX - 20, y: 76, width: 40, height: 42, rx: 12, fill: '#C8162A', stroke: '#8A0A16', 'stroke-width': 2 }, b);
  el('rect', { x: CX - 20, y: 76, width: 40, height: 42, rx: 12, fill: 'none', stroke: '#F6C963', 'stroke-width': 2, opacity: 0.6 }, b);
  // 冬青叶点缀
  [[-1], [1]].forEach(([s]) => {
    el('path', { d: `M${CX + s * 18},70 q${s * 30},-34 ${s * 64},-30 q${-s * 8},10 ${-s * 2},18 q${-s * 12},2 ${-s * 10},14 q${-s * 26},8 ${-s * 52},-2 z`, fill: '#1F7A4A', stroke: '#0E4F2E', 'stroke-width': 1.5 }, b);
  });
  [[-8, 64], [8, 64], [0, 54]].forEach(([dx, y]) => el('circle', { cx: CX + dx, cy: y, r: 9, fill: 'url(#ballRed)' }, b));
  b.insertBefore(b.lastChild.previousSibling.previousSibling, b.firstChild);
})();
</script>
</body>
</html>
