  <title id="title">初音未来 · 青绿旋律</title>
  <desc id="desc">Q版初音未来，青绿色长双马尾，粉色耳机，银灰上衣与领带，黑色百褶裙和长靴，站在青绿色音乐光环与星光中，发丝、眼睛与服装带有细腻的高光和阴影。</desc>
