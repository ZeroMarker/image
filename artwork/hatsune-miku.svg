<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc">
  <title id="title">初音未来 · 青绿旋律</title>
  <desc id="desc">Q版初音未来，青绿色长双马尾，粉色耳机，银灰上衣与领带，黑色百褶裙和长靴，站在青绿色音乐光环与星光中，发丝、眼睛与服装带有细腻的高光和阴影；层次丰富的眼睛与睫毛、脸侧鬓发、刘海投影、手臂上的“01”标记与舞台光束。</desc>
